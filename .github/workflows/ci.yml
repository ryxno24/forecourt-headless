name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CONTENT_SOURCE: fixtures
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - name: PHP syntax
        run: find wordpress/mu-plugins wordpress/themes wordpress/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON is valid
        run: find wordpress/mu-plugins wordpress/seed -name '*.json' -print0 | xargs -0 -n1 jq empty

  docker:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag forecourt-frontend frontend
